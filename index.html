<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Motion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <header class="bar">
    <a class="bar__brand" href="index.html"><span class="bar__mark" aria-hidden="true"></span>Stock Motion</a>
    <span class="mono muted">Personal motion library</span>
  </header>

  <main>
    <section class="hero">
      <h1>Motion,<br>in <em>stock.</em></h1>
      <p>Every interaction worth keeping, rebuilt as a self-contained folder. Find it here, lift it into a project.</p>
    </section>

    <div class="tools">
      <input class="search" id="search" type="search" placeholder="Search motions" aria-label="Search motions" autocomplete="off">
      <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
      <span class="tools__count mono" id="count" aria-live="polite"></span>
    </div>

    <section class="grid" id="grid" aria-label="Motions"></section>
  </main>

  <script src="motions/registry.js"></script>
  <script src="assets/js/library.js"></script>
</body>
</html>
