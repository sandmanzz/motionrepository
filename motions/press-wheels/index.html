<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Press Wheels — Stock Motion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="motion.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #161616; }
    [data-motion] { position: fixed; inset: 0; }
    /* hiasan demo: HUD, nav pill, kursor "tamu" — bukan bagian motion */
    .demo-hud { position: fixed; top: 10px; left: 14px; z-index: 90; display: flex; gap: 6px; font: 500 9px/1 "JetBrains Mono", monospace; color: #777; pointer-events: none; }
    .demo-hud span { background: rgba(255,255,255,.05); padding: 4px 6px; border-radius: 4px; }
    .demo-hud b { color: #bbb; font-weight: 500; }
    .demo-nav { position: fixed; top: 28px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; gap: 2px; padding: 4px; border-radius: 8px; background: rgba(255,255,255,.06); font: 500 13px/1 Inter, sans-serif; }
    .demo-nav a { color: #eee; text-decoration: none; padding: 8px 10px; border-radius: 5px; }
    .demo-nav a:hover { background: rgba(255,255,255,.08); }
    .demo-guest { position: fixed; left: 0; top: 0; z-index: 85; pointer-events: none; will-change: transform; }
    .demo-guest svg { width: 14px; height: 14px; display: block; }
    .demo-guest span { display: inline-block; margin: 2px 0 0 10px; padding: 2px 6px; border-radius: 4px; font: 500 9px/1.3 "JetBrains Mono", monospace; color: #111; }
    .demo-joined { position: fixed; left: 24px; bottom: 22px; z-index: 90; padding: 10px 14px; border-radius: 8px; background: rgba(255,255,255,.06); font: 500 12px/1.4 Inter, sans-serif; color: #eee; pointer-events: none; }
    .demo-joined small { display: block; color: #777; font: 500 9px/1.4 "JetBrains Mono", monospace; }
  </style>
</head>
<body>
  <div class="demo-hud"><span>UT::<b data-clock></b></span><span>FPS::<b data-fps>0</b></span><span>PRESENCE::<b>ON</b></span></div>
  <nav class="demo-nav"><a href="#">About</a><a href="#">Lab</a><a href="#">Writing</a><a href="#">Studio</a><a href="#">Contact</a></nav>

  <!-- ====== MOTION: mulai salin dari sini ====== -->
  <div data-motion></div>
  <!-- ====== MOTION: sampai sini ====== -->

  <div class="demo-joined">2 people joined<small>scroll · drag · ← → · click</small></div>

  <script src="motion.js"></script>
  <script>
    var P = [
      ["Altavilla", "w/altavilla", 2026, "AV"], ["Terraco", "w/terraco", 2026, "TE"], ["Miko", "w/miko", 2025, "MK"],
      ["Stride Lab", "w/stride", 2025, "SL"], ["Datafield", "w/datafield", 2025, "DF"], ["Haute Vallée", "w/hv", 2024, "HV"],
      ["Lens Pavilion", "w/c2", 2024, "LP"], ["Keynote Hall", "w/summit", 2024, "KH"], ["Arunika", "w/arunika", 2024, "AR"],
      ["The Crest", "w/arunika", 2023, "CR"], ["Tirta", "w/tirta", 2023, "TI"], ["Dongeng", "w/dongeng", 2023, "DG"],
      ["Guntur", "w/guntur", 2022, "GU"], ["Pasar Malam", "w/pasar", 2022, "PM"]
    ];
    var wheels = PressWheels.mount(document.querySelector("[data-motion]"), {
      items: P.map(function (p, i) {
        return { title: p[0], collab: p[1], year: p[2], mono: p[3], img: "assets/w" + String(i + 1).padStart(2, "0") + ".webp", href: "#" };
      })
    });

    // HUD: jam & FPS nyata
    (function () {
      var clock = document.querySelector("[data-clock]"), fpsEl = document.querySelector("[data-fps]"), n = 0, t = performance.now();
      (function loop(now) {
        n++; if (now - t > 500) { fpsEl.textContent = Math.round(n * 1000 / (now - t)); n = 0; t = now; clock.textContent = new Date().toTimeString().slice(0, 5); }
        requestAnimationFrame(loop);
      })(t);
    })();

    // kursor "tamu": dua bot yang berkeliaran pelan (meniru presence multiplayer)
    [["quiet heron", "#9db4ff"], ["bright lux", "#ffb38a"]].forEach(function (g, gi) {
      var d = document.createElement("div"); d.className = "demo-guest";
      d.innerHTML = '<svg viewBox="0 0 14 14"><path d="M1 1l11 5-5 1.5L5.5 13z" fill="' + g[1] + '" stroke="#111" stroke-width="1"/></svg><span style="background:' + g[1] + '">' + g[0] + "</span>";
      document.body.appendChild(d);
      var x = innerWidth * (0.3 + gi * 0.4), y = innerHeight * 0.7, tx = x, ty = y;
      (function loop() {
        if (Math.random() < 0.012) { tx = innerWidth * (0.1 + Math.random() * 0.8); ty = innerHeight * (0.15 + Math.random() * 0.7); }
        x += (tx - x) * 0.02; y += (ty - y) * 0.02;
        d.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0)";
        requestAnimationFrame(loop);
      })();
    });
  </script>
</body>
</html>
